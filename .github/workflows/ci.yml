name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository. Nothing here needs to write, so the
# token it receives cannot either, and no checkout leaves it on disk for a
# dependency's install script or a test to read.
permissions:
  contents: read

# onnxruntime-node's install script fetches its CUDA build from nuget.org on
# Linux, the one platform where it does; a runner has no GPU to use it, and on
# 2026-10-02 nuget.org stayed unreachable through a rerun. The CPU runtime the
# tests could load ships inside the package, so the download is only a way to
# fail.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One Node everywhere: .nvmrc here, the image's base, and both engines
      # fields say 24. A version that is only claimed is not a version anyone
      # has run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge/package-lock.json

      - run: npm ci

      # The suite covers the bridge, which keeps its own dependency tree.
      - run: npm ci --prefix bridge

      # Both runtime trees ship: the bridge's to the server, the root's
      # `dependencies` (the model runtime) inside main.js to every vault.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix bridge --omit=dev --audit-level=high

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      # Builds the plugin and proves the bundle stays free of Node built-ins
      # and within its size budget, which is what keeps it working on mobile.
      - run: npm run build

  # String tests cannot say whether a string is Typst; every callout once
  # failed to print while its test passed. This compiles every print fixture
  # with the typesetter and fonts a device runs, fetched and hash-checked the
  # way a release fetches them.
  print-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: node scripts/fetch-typst-runtime.mjs

      - run: npm run check:print

  # The search model's files are pinned to a commit and hashed, and a device
  # refuses anything else. This fetches every pinned file from Hugging Face at
  # its commit and compares; while a pin is empty or wrong it prints the file
  # to commit and fails. Nothing it downloads is kept.
  model-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts

      - run: node scripts/check-model-pins.mjs

  # The Dockerfile is what the hosting platform runs. Building it here means a
  # broken image is found by CI rather than by the next deploy.
  bridge-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag schreibstube-bridge:ci bridge
      # The deps stage vendors Mermaid and drops its tree; both halves of that
      # have to have happened, or a published diagram would fail at commit.
      - name: Check the image kept Mermaid's file and not its tree
        run: |
          docker run --rm schreibstube-bridge:ci sh -c \
            'test -s vendor/mermaid.min.js && test ! -e node_modules/mermaid && du -sh node_modules'
      - name: Boot the image and probe /health
        run: |
          docker run --detach --name bridge --publish 8080:8080 \
            --env MAIL_TOKEN=ci-only-token-that-is-long-enough \
            --env IMAP_HOST=127.0.0.1 --env SMTP_HOST=127.0.0.1 \
            --env MAIL_USER=ci@example.com --env MAIL_PASSWORD=ci \
            --env MAIL_FROM=ci@example.com \
            schreibstube-bridge:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs bridge
          exit 1
