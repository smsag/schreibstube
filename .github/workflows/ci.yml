name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The bridge declares support from Node 20; CI should say whether that
        # is true rather than assume it.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge/package-lock.json

      - run: npm ci

      # The suite covers the bridge, which keeps its own dependency tree.
      - run: npm ci --prefix bridge

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      # Builds the plugin and proves the bundle stays free of Node built-ins,
      # which is what keeps it working on mobile.
      - run: npm run build
