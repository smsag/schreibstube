name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository. Nothing here needs to write, so the
# token it receives cannot either.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One Node everywhere: .nvmrc here, the image's base, and both engines
      # fields say 24. A version that is only claimed is not a version anyone
      # has run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge/package-lock.json

      - run: npm ci

      # The suite covers the bridge, which keeps its own dependency tree.
      - run: npm ci --prefix bridge

      # The bridge's runtime dependencies are the only ones that ship anywhere.
      # The plugin has none: everything in the root tree is build tooling.
      - run: npm audit --prefix bridge --omit=dev --audit-level=high

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      # Builds the plugin and proves the bundle stays free of Node built-ins
      # and within its size budget, which is what keeps it working on mobile.
      - run: npm run build

  # The Dockerfile is what the hosting platform runs. Building it here means a
  # broken image is found by CI rather than by the next deploy.
  bridge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag schreibstube-bridge:ci bridge
      # The deps stage vendors Mermaid and drops its tree; both halves of that
      # have to have happened, or a published diagram would fail at commit.
      - name: Check the image kept Mermaid's file and not its tree
        run: |
          docker run --rm schreibstube-bridge:ci sh -c \
            'test -s vendor/mermaid.min.js && test ! -e node_modules/mermaid && du -sh node_modules'
      - name: Boot the image and probe /health
        run: |
          docker run --detach --name bridge --publish 8080:8080 \
            --env MAIL_TOKEN=ci-only-token-that-is-long-enough \
            --env IMAP_HOST=127.0.0.1 --env SMTP_HOST=127.0.0.1 \
            --env MAIL_USER=ci@example.com --env MAIL_PASSWORD=ci \
            --env MAIL_FROM=ci@example.com \
            --env PLAN_TOKEN=ci-only-plan-token-long-enough \
            --env CALDAV_URL=https://caldav.invalid/calendars/ \
            --env CALDAV_USER=ci --env CALDAV_PASSWORD=ci \
            schreibstube-bridge:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            if [ "$attempt" = 20 ]; then docker logs bridge; exit 1; fi
            sleep 1
          done
      # The one file the bridge writes has to be writable by the user it runs
      # as; a read alone would pass on a store it cannot save to.
      - name: Save a plan inside the image
        run: |
          curl --fail --silent --show-error -X PUT http://127.0.0.1:8080/plan \
            -H 'authorization: Bearer ci-only-plan-token-long-enough' \
            -H 'content-type: application/json' \
            --data '{"rev":0,"document":{"v":1,"deadlines":{},"blocks":[],"anchors":{},"queue":[],"acked":0,"completions":[]}}' \
            || { docker logs bridge; exit 1; }
