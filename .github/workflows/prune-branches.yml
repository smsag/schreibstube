name: Prune branches

# After each release, once a week in case a release is a while off, and by
# hand. What may be deleted, and why nothing on such a branch is lost, is in
# scripts/prune-branches.mjs.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, and delete nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: prune-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deleting a branch is a write, and this is the one job that may: it
    # checks out the script and runs it with Node alone. No install, so no
    # dependency's code ever holds this token.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/prune-branches.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prune
        run: node scripts/prune-branches.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Only a run started by hand can be a dry run; the release and the
          # weekly run prune for real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
